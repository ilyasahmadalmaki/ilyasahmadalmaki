<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff2a6d;#7b2ff7;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff2a6d">
        <animate attributeName="stop-color" values="#ff2a6d;#7b2ff7;#00f0ff;#ff2a6d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00f0ff;#ff2a6d;#7b2ff7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="footShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <text id="footTitle" x="600" y="105" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="900" letter-spacing="4">PENGALAMAN NYATA // BUKAN TEORI</text>
    <clipPath id="footClip">
      <use href="#footTitle" xlink:href="#footTitle"/>
    </clipPath>
  </defs>
  <use href="#footTitle" xlink:href="#footTitle" fill="url(#footGrad)" filter="url(#footGlow)"/>
  <rect x="0" y="0" width="240" height="220" fill="url(#footShine)" clip-path="url(#footClip)">
    <animateTransform attributeName="transform" type="translate" values="-300 0; 1300 0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="250" y="160" width="700" height="3" rx="1.5" fill="url(#footGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
