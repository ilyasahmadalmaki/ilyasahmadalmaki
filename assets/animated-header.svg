<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff2a6d;#7b2ff7;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff2a6d">
        <animate attributeName="stop-color" values="#ff2a6d;#7b2ff7;#00f0ff;#ff2a6d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00f0ff;#ff2a6d;#7b2ff7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <text id="title" x="600" y="140" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="900" letter-spacing="6">HYDRA TEAM BRINGAS</text>
    <clipPath id="titleClip">
      <use href="#title" xlink:href="#title"/>
    </clipPath>
  </defs>
  <use href="#title" xlink:href="#title" fill="url(#textGrad)" filter="url(#glow)"/>
  <rect x="0" y="0" width="260" height="320" fill="url(#shine)" clip-path="url(#titleClip)">
    <animateTransform attributeName="transform" type="translate" values="-300 0; 1300 0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="205" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="26" letter-spacing="10" fill="#00f0ff">PERMUDAH HIDUPMU</text>
  <rect x="813" y="182" width="14" height="30" fill="#ff2a6d">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="200" y="245" width="800" height="4" rx="2" fill="url(#textGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
